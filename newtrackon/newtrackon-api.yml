openapi: 3.0.3
info:
  title: newTrackon API
  version: "2.1_NZ"
  description: |
    API for retrieving and submitting trackers to newTrackon (Wellington NZ fork).

    **Just want a tracker list? Pick where you are and copy the link into your torrent client:**

    | You are in | For example | Copy this link |
    |---|---|---|
    | Australia, New Zealand or the Pacific | Australia, New Zealand, Fiji | [https://newtrackon.co.nz/api/clean?fast_from=oceania](https://newtrackon.co.nz/api/clean?fast_from=oceania) |
    | Asia | China, Japan, Korea, India, Singapore, Thailand | [https://newtrackon.co.nz/api/clean?fast_from=asia](https://newtrackon.co.nz/api/clean?fast_from=asia) |
    | Europe, the Middle East or Africa | UK, Germany, Russia, Turkey, UAE, South Africa | [https://newtrackon.co.nz/api/clean?fast_from=europe](https://newtrackon.co.nz/api/clean?fast_from=europe) |
    | North, Central or South America | USA, Canada, Mexico, Brazil, Chile | [https://newtrackon.co.nz/api/clean?fast_from=americas](https://newtrackon.co.nz/api/clean?fast_from=americas) |
    | Anywhere / not sure | | [https://newtrackon.co.nz/api/clean](https://newtrackon.co.nz/api/clean) |

    Each link gives the recommended clean list, limited to trackers that answer quickly from your part of the world.
    Most torrent clients (qBittorrent, Transmission, Deluge...) can load trackers from a link like this, or you can
    open it and paste the list. The [List page](https://newtrackon.co.nz/list) does the same with buttons.

    **Which list should I use?** (for everyone else)

    | Endpoint | Status filter | Score | Min. days listed | One per operator | Use it for |
    |---|---|---|---|---|---|
    | `/clean` | never Junk, Bad or down | 90+ (adjustable) | 3 (adjustable) | yes (adjustable) | Pasting into a torrent client. Recommended. |
    | `/stable` | none, score only | 90+ | 7 (adjustable) | no | The list shown on the List page. |
    | `/{score}` | none, score only | your choice | 0 | no | A custom score cut-off. |
    | `/udp`, `/http` | none, score only | 90+ | 0 | no | Clients or networks limited to one protocol. |
    | `/live` | responding right now | any | 0 | no | Maximum coverage, including flaky trackers. |
    | `/all` | none | any | 0 | no | Building your own checker. Includes dead trackers. |

    All of these return plain text: announce URLs separated by blank lines. `/details` returns the full state of
    every tracker as JSON, and `/feed.xml` is an Atom feed of tracker events.

    Only `/clean` checks a tracker's current status. The other lists filter on score alone. The score already
    reflects quality faults, but a tracker that has just gone down can still appear until its score drops.
  contact:
    name: Kolan Koala
    url: https://newtrackon.co.nz/about
  license:
    name: MIT
    url: https://github.com/CorralPeltzer/newTrackon/blob/master/LICENSE.txt
servers:
  - url: https://newtrackon.co.nz/api

tags:
  - name: Recommended
    description: Start here. /clean is the list to give a torrent client; /details and /feed.xml are for scripts and monitoring.
  - name: newTrackon-compatible
    description: The original newTrackon list endpoints, kept so tools written for newtrackon.com work here unchanged. They filter on score only.
  - name: Submitting
    description: Add trackers to be checked.

paths:
  /clean:
    get:
      summary: Clean list for torrent clients (NZ fork)
      tags: [Recommended]
      description: >-
        Trackers that are up and not Junk, Bad or Broken (Up/Good or Up/Slow; also Up/New or Up/Unreliable if they still reach min_score), listed at least min_age_days days, with a score of at least min_score, no confirmed
        dead IP family, and by default only the best tracker from each operator. The list to paste into a client.
      parameters:
        - name: min_score
          in: query
          required: false
          description: Minimum score (as displayed, rounded).
          schema: {type: number, default: 90, minimum: 0, maximum: 100}
        - name: max_latency
          in: query
          required: false
          description: >-
            Maximum latency in milliseconds, average across all probe points. 0 means no limit. For speed from one part
            of the world use fast_from instead.
          schema: {type: integer, default: 0, minimum: 0}
        - name: min_age_days
          in: query
          description: Minimum days listed (monitoring history). 0 means no minimum.
          schema: {type: number, default: 3, minimum: 0}
        - name: require_ipv4
          in: query
          required: false
          description: Only trackers with a working IPv4 address.
          schema: {type: boolean, default: false}
        - name: dedupe
          in: query
          required: false
          description: Keep only the best tracker per operator (same servers or same domain).
          schema: {type: boolean, default: true}
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/FastFrom"
        - $ref: "#/components/parameters/FastFromMs"
        - $ref: "#/components/parameters/Good"
        - $ref: "#/components/parameters/Protocol"
        - $ref: "#/components/parameters/IPv4Works"
        - $ref: "#/components/parameters/IPv6Works"
        - $ref: "#/components/parameters/PassesPeerTest"
      responses:
        "200":
          description: Announce URLs, one per line, separated by blank lines (same format as the other lists).
          content:
            text/plain:
              schema: {type: string}
              example: "udp://tracker.example.org:1337/announce\n\nhttps://tracker.example.net:443/announce\n"
        "400":
          description: min_score, min_age_days or max_latency is not a number, or a region option is invalid.
  /details:
    get:
      summary: Full state of every tracker as JSON (NZ fork)
      tags: [Recommended]
      description: >-
        Everything the site knows about each tracker - status (up_good / up_new / up_slow / up_unreliable / up_junk / up_broken / up_bad / down) and problems, score, latency
        and latency by region, IP families, peer-test record, fake-peer streak, flags, the tracker's own announce interval,
        availability stats, same-operator group, IPs, countries, networks and regions. Accepts the region filters too.
      parameters:
        - $ref: "#/components/parameters/Region"
        - $ref: "#/components/parameters/FastFrom"
        - $ref: "#/components/parameters/FastFromMs"
        - $ref: "#/components/parameters/Good"
        - $ref: "#/components/parameters/Protocol"
        - $ref: "#/components/parameters/IPv4Works"
        - $ref: "#/components/parameters/IPv6Works"
        - $ref: "#/components/parameters/PassesPeerTest"
      responses:
        "200":
          description: One object per tracker.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                      url: {type: string, description: "The announce URL listed."}
                      host: {type: string}
                      status:
                        type: string
                        enum: [up_good, up_new, up_slow, up_unreliable, up_junk, up_broken, up_bad, down]
                        description: >-
                          up_good: passes everything, score 90+. up_new: healthy, under 7 days old. up_slow: reliable
                          but 300 ms+ on average. up_unreliable: under 90 from dropouts. up_junk: score under 50.
                          up_broken: works for some clients only (see problems). up_bad: answers but hands out no usable
                          peers, or fake ones. down: not answering.
                      problems:
                        type: array
                        items: {type: string}
                        description: >-
                          Why it's up_bad or up_broken (empty otherwise). no_peers: 3+ of its last 6 peer tests failed
                          (including handing out an address nobody can connect to). fake_peers: peers on a random
                          torrent only we know, 3+ of its last 6 checks. dead_ipv4 / dead_ipv6: that published address
                          family hasn't answered in 3+ checks in a row. nopeers_ipv4 / nopeers_ipv6: that family
                          answers but fails the peer test while the other passes. split_swarm: separate servers that
                          don't share swarms; clients only meet peers on the same server (1 in 3+ tests pass). up_bad
                          has no_peers or fake_peers; up_broken has only the others.
                      score: {type: number, description: "0-100: availability x stability, minus latency and interval penalties."}
                      latency_ms: {type: [integer, "null"], description: "From this server (Wellington)."}
                      latency_by_region_ms: {type: object, description: "Typical announce round trip from Oceania, Asia, Europe and North America."}
                      regions: {type: array, items: {type: string}}
                      families:
                        type: object
                        description: >-
                          Per address family, v4 and v6: ok (answers), dead (3+ failed checks in a row) or
                          not_published. Whether it answers, not whether it shares peers: see peer_test.by_family.
                      peer_test:
                        type: object
                        description: >-
                          The peer test: our first client announces a random torrent, a second client from another
                          country (a VPN exit) must then be handed the first one, with its real address. latest:
                          pass, fail or n/a. passed / of: the last 6 results. by_family: {v4|v6: {passed, of}}, the
                          last 6 on each family. last_seen: {v4|v6: what the second client was handed in the last test
                          on that family}: a (ok = our first client with its real address, private = under a private
                          address, other = under an address that isn't ours, i.e. a proxy or CDN's, null = not at all),
                          a_ip (that wrong address), self (handed back only itself), foreign (peers that can't exist),
                          seeds / leech (the counts it reported), ok (the verdict), t (Unix time); or swarm_empty:
                          true when the VPN exits got no answer and a second client from this server found nobody
                          counted. The VPN exits' own addresses are never included.
                      unusable_address:
                        type: object
                        description: >-
                          {v4|v6: address} it hands out instead of clients' real ones on that family (172.17.0.1 =
                          Docker's port proxy; 10.x / 127.0.0.1 = NAT or a local reverse proxy; a public address = a
                          proxy or CDN). Empty when none.
                      fake_peers: {type: object, description: "latest: fake peers in the last check; streak: of the last 6."}
                      stale_peers: {description: "Keeps handing out a peer after it sent 'stopped' (flag only)."}
                      spoof_proof: {description: "UDP: enforces the BEP 15 connection ID. HTTP(S) always true."}
                      announce_interval_s: {type: [integer, "null"], description: "The interval it asks clients for. Outside 15 min - 3 h costs up to 5 points."}
                      check_interval_s: {type: integer, description: "How often this site checks it."}
                      stats: {type: object}
                      down_reason: {type: [string, "null"]}
                      down_cause: {type: [string, "null"]}
                      same_operator_as: {type: array, items: {type: string}, description: "Other listed hosts on the same server."}
                      ips: {type: array, items: {type: string}}
                      countries: {type: array, items: {type: string}}
                      country_codes: {type: array, items: {type: string}, description: "ISO 3166 alpha-2, lower case."}
                      warning_message: {type: [string, "null"], description: "The tracker's own 'warning message' from its last reply, if any."}
                      networks: {type: array, items: {type: string}}
                      added: {type: integer, description: "When it was listed (Unix time)."}
                      last_checked: {type: integer}
  /tracker/{host}:
    get:
      summary: Full state of one tracker as JSON (NZ fork)
      tags: [Recommended]
      description: >-
        The same object /details gives for each tracker, for one host - handy for watching your own tracker
        from your monitoring. The host is case-insensitive. It also has "daily": one entry per UTC day, oldest first,
        kept for good - day, uptime (% of 30-minute slots up), slots (how many were recorded that day) and
        latency_ms (typical announce round trip from each region).
      parameters:
        - name: host
          in: path
          required: true
          description: The tracker's hostname, e.g. tracker.opentrackr.org
          schema:
            type: string
      responses:
        "200":
          description: The tracker's state (same fields as one /details entry, plus daily).
          content:
            application/json:
              schema:
                type: object
        "404":
          description: 'Not on the list. Body: {"error": "not listed", "host": "..."}'
          content:
            application/json:
              schema:
                type: object
  /removed:
    get:
      summary: Trackers removed and still banned (NZ fork)
      description: >-
        Trackers this site removed whose ban hasn't ended: no answer for 5 days, or under 15% once dropouts count;
        Up/Bad (no or fake peers) for 5 days or 80% of the last 7; Up/Junk or Up/Broken for 30 days; private or
        whitelist-only. Bans: 30 days for the first removal, 90 for the second, for good after that. Each has host, url,
        removed (Unix time), reason and banned_until (Unix time, or null if permanent). Their /tracker/{host} pages stay
        up, with a "Check again now" button that relists a fixed tracker and lifts its ban.
      responses:
        "200":
          description: A list, soonest ban end first.
          content:
            application/json:
              schema:
                type: array
  /feed.xml:
    servers:  # feed-root-server: the feed lives at the site root, not under /api
      - url: https://newtrackon.co.nz
    get:
      summary: Atom/RSS feed of tracker events (NZ fork)
      tags: [Recommended]
      description: >-
        A tracker going down or coming back up, turning Up/Bad, Up/Broken, Up/Slow, Up/Unreliable, Up/Junk or Up/Good, an IP family dying or recovering, trackers
        added and removed. Newest first, up to 100 entries.
      parameters:
        - name: tracker
          in: query
          required: false
          description: Only events for trackers whose URL contains this text, e.g. opentrackr.
          schema: {type: string}
        - name: type
          in: query
          required: false
          description: Comma-separated event types - down, up, bad, good, family, added, removed.
          schema: {type: string}
      responses:
        "200":
          description: Atom feed.
          content:
            application/atom+xml:
              schema: {type: string}
  /stable:
    parameters:
      - $ref: "#/components/parameters/IncludeIPv4OnlyTrackers"
      - $ref: "#/components/parameters/IncludeIPv6OnlyTrackers"
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
    get:
      summary: Get stable trackers
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of trackers with a score of 90 or more that have been listed for at least min_age_days days (default 7). Filters on score only - no status check and no one-per-operator rule. For a client-ready list use /clean.
      responses:
        "200":
          description: Stable trackers
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Trackers"
  /{score}:
    parameters:
      - $ref: "#/components/parameters/IncludeIPv4OnlyTrackers"
      - $ref: "#/components/parameters/IncludeIPv6OnlyTrackers"
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
      - name: score
        in: path
        description: Minimum score (0-100)
        required: true
        schema:
          type: integer
          minimum: 0
          maximum: 100
    get:
      summary: Get trackers with a minimum score
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of trackers with a score equal to or above the given value. Same rule as /stable with your own cut-off, and no minimum age unless you set min_age_days. The score is uptime adjusted for stability, latency and quality checks (see the About page).
      responses:
        "200":
          description: Stable trackers
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Trackers"
        "400":
          description: Invalid percentage
  /live:
    parameters:
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
    get:
      summary: Get working trackers
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of every tracker that answered its last check, whatever its score. Includes Up/Unreliable, Up/Junk, Up/Bad and Up/Broken trackers.
      responses:
        "200":
          description: Working trackers
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Trackers"
  /udp:
    parameters:
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
    get:
      summary: Get stable UDP trackers
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of UDP trackers with a score of 90 or more. Same rule as /stable but with no minimum age unless you set min_age_days.
      responses:
        "200":
          description: UDP trackers
          content:
            text/plain:
              example: |
                udp://example1.com:8080/announce

                udp://example2.com:8080/announce

                udp://example3.com:8080/announce
              schema:
                $ref: "#/components/schemas/Trackers"
  /http:
    parameters:
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
    get:
      summary: Get stable HTTP/HTTPS trackers
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of HTTP and HTTPS trackers with a score of 90 or more. Same rule as /stable but with no minimum age unless you set min_age_days.
      responses:
        "200":
          description: HTTP/HTTPS trackers
          content:
            text/plain:
              example: |
                https://example1.com:8080/announce

                https://example2.com:8080/announce

                http://example3.com:8080/announce
              schema:
                $ref: "#/components/schemas/Trackers"

  /all:
    parameters:
      - $ref: "#/components/parameters/IncludeIPv4OnlyTrackers"
      - $ref: "#/components/parameters/IncludeIPv6OnlyTrackers"
      - $ref: "#/components/parameters/MinAgeDays"
      - $ref: "#/components/parameters/Region"
      - $ref: "#/components/parameters/FastFrom"
      - $ref: "#/components/parameters/FastFromMs"
      - $ref: "#/components/parameters/Good"
      - $ref: "#/components/parameters/Protocol"
      - $ref: "#/components/parameters/IPv4Works"
      - $ref: "#/components/parameters/IPv6Works"
      - $ref: "#/components/parameters/PassesPeerTest"
    get:
      summary: Get all trackers
      tags:
        - newTrackon-compatible
      description: Announce URLs, separated by blank lines, of every tracker in the database, dead or alive. No filtering at all.
      responses:
        "200":
          description: All trackers
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Trackers"
  /add:
    post:
      summary: Submit new trackers
      tags:
        - Submitting
      description: Submits new trackers to be checked and either accepted or discarded
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NewTrackers"
      responses:
        "204":
          description: Trackers added to the queue
        "400":
          description: No trackers provided
        "413":
          description: Too many trackers submitted

components:
  schemas:
    Trackers:
      type: string
      additionalProperties: false
      example: |
        udp://example1.com:8080/announce

        https://example2.com:8080/announce

        http://example3.com:8080/announce
      maxLength: 1000000
    NewTrackers:
      type: object
      additionalProperties: false
      properties:
        new_trackers:
          $ref: "#/components/schemas/Trackers"

  parameters:
    IncludeIPv4OnlyTrackers:
      in: query
      name: include_ipv4_only_trackers
      description: Include trackers that resolve only to IPv4 addresses.
      schema:
        type: boolean
        default: true
    IncludeIPv6OnlyTrackers:
      in: query
      name: include_ipv6_only_trackers
      description: Include trackers that resolve only to IPv6 addresses.
      schema:
        type: boolean
        default: true
    Region:
      in: query
      name: region
      description: >-
        Only trackers located in these regions (by the country of their IP addresses; a tracker counts if any of its
        addresses is there). Comma-separated. Regions follow how the internet is wired: americas (North, Central and
        South America), europe (Europe, Russia, Central Asia, the Middle East and Africa), asia-pacific (Asia and Oceania).
        Trackers with no known country are left out.
      schema:
        type: string
        example: europe
    FastFrom:
      in: query
      name: fast_from
      description: >-
        Only trackers that answer quickly from one of the four places latency is measured from: americas (North
        America), europe, asia or oceania. Measured round trips, so they reflect real internet routing.
        Trackers not yet measured from there are left out. (The older value asia-pacific still works: fast from both
        Asia and Oceania, 250 ms by default.)
      schema:
        type: string
        enum: [americas, europe, asia, oceania]
    Good:
      in: query
      name: good
      description: Only Up/Good trackers (including Up/New ones still building their first week).
      schema: {type: boolean, default: false}
    Protocol:
      in: query
      name: protocol
      description: Only UDP trackers, or only HTTP/HTTPS trackers.
      schema: {type: string, enum: [udp, http]}
    IPv4Works:
      in: query
      name: ipv4_works
      description: Only trackers whose IPv4 address answers.
      schema: {type: boolean, default: false}
    IPv6Works:
      in: query
      name: ipv6_works
      description: Only trackers whose IPv6 address answers.
      schema: {type: boolean, default: false}
    PassesPeerTest:
      in: query
      name: passes_peer_test
      description: Only trackers that passed their latest peer test (they really hand out peers).
      schema: {type: boolean, default: false}
    FastFromMs:
      in: query
      name: fast_from_ms
      description: >-
        Latency limit for fast_from, in milliseconds. Default 150.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
    MinAgeDays:
      in: query
      name: min_age_days
      description: Minimum tracker age in days. Default is 7 for /stable and 0 for all other list endpoints.
      schema:
        type: integer
        minimum: 0
